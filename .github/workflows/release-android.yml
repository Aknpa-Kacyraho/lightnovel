name: Signed Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify required signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.LIGHTNOVEL_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LIGHTNOVEL_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIGHTNOVEL_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIGHTNOVEL_RELEASE_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "缺少签名 Secret: $name" >&2
              exit 1
            fi
          done
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LIGHTNOVEL_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lightnovel-release.jks"
          chmod 600 "$RUNNER_TEMP/lightnovel-release.jks"
      - name: Build signed release
        working-directory: android
        env:
          LIGHTNOVEL_RELEASE_STORE_FILE: ${{ runner.temp }}/lightnovel-release.jks
          LIGHTNOVEL_RELEASE_STORE_PASSWORD: ${{ secrets.LIGHTNOVEL_RELEASE_STORE_PASSWORD }}
          LIGHTNOVEL_RELEASE_KEY_ALIAS: ${{ secrets.LIGHTNOVEL_RELEASE_KEY_ALIAS }}
          LIGHTNOVEL_RELEASE_KEY_PASSWORD: ${{ secrets.LIGHTNOVEL_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify APK signature
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "$RUNNER_TEMP/lightnovel-release.apk"
          sha256sum "$RUNNER_TEMP/lightnovel-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: lightnovel-signed-release
          path: ${{ runner.temp }}/lightnovel-release.apk
          if-no-files-found: error
          retention-days: 14
